name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Detect which areas of the codebase changed so we can skip jobs that have
  # no work to do on this PR. On pushes to main we always run everything via
  # the `|| github.event_name == 'push'` fallback in each job's `if:`.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'db/migrations/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'spec/openapi/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            build:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'frontend/**'
              - 'spec/openapi/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    # Tests use modernc.org/sqlite, which is embedded in the Go binary — no
    # external database service needed. Each test that needs a DB opens an
    # in-memory SQLite instance via db.OpenMemoryDB or db.Connect(ctx, ":memory:").
    env:
      DATABASE_PATH: ":memory:"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go build & test results
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Ensure frontend/dist exists for go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Run backend tests
        run: |
          set -o pipefail
          if ! go test ./... 2>&1 | tee /tmp/backend-tests.log; then
            RC=${PIPESTATUS[0]}
            echo ""
            echo "=== BACKEND TESTS FAILED — last 30 lines of output as annotations ==="
            tail -n 30 /tmp/backend-tests.log | while IFS= read -r line; do
              # Skip empty lines, strip ANSI, cap length
              clean=$(echo "$line" | sed -E 's/\x1b\[[0-9;]*m//g' | tr -d '\r' | head -c 800)
              [ -n "$clean" ] && echo "::error::$clean"
            done
            exit $RC
          fi

  frontend:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --ignore-scripts

      - name: Bundle OpenAPI spec and verify it is committed
        run: |
          make bundle
          if ! git diff --exit-code spec/openapi/openapi.bundle.yaml; then
            echo "::error::spec/openapi/openapi.bundle.yaml is out of date. Run 'make bundle' and commit the result."
            exit 1
          fi

      - name: Generate frontend API client
        run: make generate-frontend-from-bundle

      - name: Run frontend tests
        run: make test-frontend

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Vite inlines these at build time; CI only needs deterministic placeholders.
      VITE_SUPABASE_URL: https://ci-placeholder.local
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: make install-build-deps

      # The bundle file is already committed and verified by the Frontend Tests
      # job; here we only need to regenerate the TypeScript API client because
      # frontend/src/api/schema.d.ts is not committed and `npm ci --ignore-scripts`
      # skipped the postinstall that would normally produce it.
      - name: Generate frontend API client
        run: make generate-frontend-from-bundle

      - name: Build server (frontend + Go)
        run: |
          set -o pipefail
          mkdir -p frontend/dist && touch frontend/dist/.gitkeep
          if ! make build-ci 2>&1 | tee /tmp/build.log; then
            RC=${PIPESTATUS[0]}
            echo ""
            echo "=== BUILD FAILED — last 30 lines of output as annotations ==="
            tail -n 30 /tmp/build.log | while IFS= read -r line; do
              clean=$(echo "$line" | sed -E 's/\x1b\[[0-9;]*m//g' | tr -d '\r' | head -c 800)
              [ -n "$clean" ] && echo "::error::$clean"
            done
            exit $RC
          fi

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend, frontend, build]
    if: ${{ failure() && github.event_name == 'push' }}
    steps:
      - name: Send SNS SMS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SNS_PHONE_TO: ${{ secrets.SNS_PHONE_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ github.workflow }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_DEFAULT_REGION" ]; then
            echo "::warning::AWS credentials/region not configured, skipping SNS SMS"
            exit 0
          fi
          if [ -z "$SNS_PHONE_TO" ]; then
            echo "::warning::SNS_PHONE_TO secret is not set, skipping SMS"
            exit 0
          fi
          MESSAGE="permission-slip CI failed: ${TITLE} on ${BRANCH} — ${RUN_URL}"

          aws sns publish \
            --phone-number "${SNS_PHONE_TO}" \
            --message "${MESSAGE}" \
            --message-attributes '{"AWS.SNS.SMS.SMSType":{"DataType":"String","StringValue":"Transactional"}}'

      - name: Send webhook notification
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "::warning::NOTIFY_WEBHOOK_URL secret is not set, skipping webhook"
            exit 0
          fi
          MESSAGE="permission-slip: CI failed on ${BRANCH} — investigate: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg msg "$MESSAGE" --arg secret "$NOTIFY_WEBHOOK_SECRET" \
            '{message: $msg, secret: $secret}')
          curl -s -f -X POST "$NOTIFY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || { echo "::warning::Webhook notification request failed"; true; }
