StandingApprovalRequest:
  type: object
  required:
    - request_id
    - agent_id
    - user_id
    - action_type
    - action_version
    - constraints
    - status
    - created_at
    - updated_at
  properties:
    request_id:
      type: string
    agent_id:
      type: integer
      format: int64
    user_id:
      type: string
      format: uuid
    action_type:
      type: string
    action_version:
      type: string
    constraints:
      type: object
      additionalProperties: true
    connector_name:
      type: string
      nullable: true
      description: |
        Human-readable connector name frozen at proposal time (e.g. "Proton Mail").
    connector_instance_id:
      type: string
      nullable: true
      description: |
        Connector instance UUID frozen at proposal time when the agent declared
        connector_instance on the request.
    connector_instance_display:
      type: string
      nullable: true
      description: |
        Human-readable connector instance label when the agent declared
        connector_instance (e.g. "Personal"). Mirrors `_connector_instance_display`
        on regular approvals.
    status:
      type: string
      enum: [pending, approved, denied, expired, cancelled]
    decided_at:
      type: string
      format: date-time
      nullable: true
    resulting_standing_approval_id:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

StandingApprovalRequestListResponse:
  type: object
  required:
    - data
    - has_more
  properties:
    data:
      type: array
      items:
        $ref: '#/StandingApprovalRequest'
    has_more:
      type: boolean
    next_cursor:
      type: string
      nullable: true

AgentCreateStandingApprovalRequestBody:
  type: object
  required:
    - action_type
    - constraints
  properties:
    action_type:
      type: string
    action_version:
      type: string
    constraints:
      type: object
      additionalProperties: true
    connector_instance:
      type: string
      description: |
        Optional connector instance selector (UUID or display name) declaring which
        account this rule proposal applies to.

AgentCreateStandingApprovalRequestResponse:
  type: object
  required:
    - request_id
    - status
  properties:
    request_id:
      type: string
    status:
      type: string
      enum: [pending]

ApproveStandingApprovalRequestResponse:
  type: object
  required:
    - request_id
    - status
    - resulting_standing_approval_id
  properties:
    request_id:
      type: string
    status:
      type: string
    resulting_standing_approval_id:
      type: string
    standing_approval:
      $ref: '../schemas/standing_approvals.yaml#/StandingApproval'

DenyStandingApprovalRequestResponse:
  type: object
  required:
    - request_id
    - status
    - decided_at
  properties:
    request_id:
      type: string
    status:
      type: string
    decided_at:
      type: string
      format: date-time
