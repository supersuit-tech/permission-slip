AgentWebhookConfig:
  type: object
  properties:
    configured:
      type: boolean
    webhook_url:
      type: string
    provider:
      type: string
      enum:
        - openclaw
        - grokbot
      description: Wake delivery adapter. Omitted when no webhook is configured. Defaults to openclaw for legacy rows.
    warning:
      type: string
      description: Advisory when another agent for the same approver shares this webhook URL
    test:
      $ref: '#/AgentWebhookTestResult'

SetAgentWebhookRequest:
  type: object
  required:
    - url
    - token
  properties:
    url:
      type: string
      description: |
        OpenClaw gateway hooks base URL (private network only), or Grok Bot
        Cursor automation webhook URL (`https://api2.cursor.sh/automations/webhook/…`).
      example: "http://100.64.0.5:18789/hooks"
    token:
      type: string
      description: OpenClaw hooks bearer token, or Grok Bot Authorization header value
    provider:
      type: string
      enum:
        - openclaw
        - grokbot
      default: openclaw
      description: Wake delivery adapter. Defaults to openclaw.

AgentWebhookTestResult:
  type: object
  properties:
    configured:
      type: boolean
    success:
      type: boolean
    message:
      type: string
    webhook_url:
      type: string
    latency_ms:
      type: integer
      format: int64

AgentApprovalSweepItem:
  type: object
  required:
    - approval_id
    - status
    - expires_at
  properties:
    approval_id:
      type: string
    status:
      type: string
      enum:
        - pending
        - approved
        - denied
        - cancelled
        - expired
    expires_at:
      type: string
      format: date-time
    resolved_at:
      type: string
      format: date-time
    denial_reason:
      type: string

AgentApprovalSweepResponse:
  type: object
  required:
    - pending
    - resolved
  properties:
    pending:
      type: array
      items:
        $ref: '#/AgentApprovalSweepItem'
    resolved:
      type: array
      items:
        $ref: '#/AgentApprovalSweepItem'
