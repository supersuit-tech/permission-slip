AgentWebhookConfig:
  type: object
  properties:
    configured:
      type: boolean
      description: True when a wake token is registered for this agent.
    provider:
      type: string
      enum:
        - openclaw
        - grokbot
      description: Wake delivery adapter. Omitted when no token is registered. Defaults to openclaw for legacy rows.
    warning:
      type: string
      description: Reserved advisory field.
    test:
      $ref: '#/AgentWebhookTestResult'

SetAgentWebhookRequest:
  type: object
  required:
    - token
  properties:
    token:
      type: string
      description: OpenClaw hooks bearer token, or Grok Bot Authorization header value. The destination URL is not stored here.
    provider:
      type: string
      enum:
        - openclaw
        - grokbot
      default: openclaw
      description: Wake delivery adapter. Defaults to openclaw. Each approval supplies its own callback_url, which must match this provider.

AgentWebhookTestResult:
  type: object
  properties:
    configured:
      type: boolean
    success:
      type: boolean
    message:
      type: string
    webhook_url:
      type: string
      description: The URL the test wake was sent to.
    latency_ms:
      type: integer
      format: int64

AgentApprovalSweepItem:
  type: object
  required:
    - approval_id
    - status
    - expires_at
  properties:
    approval_id:
      type: string
    status:
      type: string
      enum:
        - pending
        - approved
        - denied
        - cancelled
        - expired
    expires_at:
      type: string
      format: date-time
    resolved_at:
      type: string
      format: date-time
    denial_reason:
      type: string

AgentApprovalSweepResponse:
  type: object
  required:
    - pending
    - resolved
  properties:
    pending:
      type: array
      items:
        $ref: '#/AgentApprovalSweepItem'
    resolved:
      type: array
      items:
        $ref: '#/AgentApprovalSweepItem'
