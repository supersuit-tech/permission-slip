AgentCapabilitiesResponse:
  type: object
  required:
    - agent_id
    - connectors
  properties:
    agent_id:
      type: integer
      format: int64
      description: |
        The authenticated agent's identifier.
      example: 42

    approver:
      allOf:
        - $ref: '../schemas/shared.yaml#/ApproverInfo'
      description: |
        The user (approver) whose capabilities are being returned. Identifies
        which user's connectors and standing approvals
        are represented in this response.

    connectors:
      type: array
      items:
        $ref: '../schemas/capabilities.yaml#/ConnectorCapability'
      description: |
        Connectors enabled for this agent, with full action schemas and authorization
        status. Only connectors the user has explicitly enabled for this agent are
        included — not all globally available connectors.

        If the agent has no enabled connectors, this array is empty.

  example:
    agent_id: 42
    approver:
      username: "alice"
    connectors:
      - id: "gmail"
        name: "Gmail"
        description: "Send and manage emails via Gmail API"
        credentials_ready: true
        actions:
          - action_type: "email.send"
            name: "Send Email"
            description: "Send an email via Gmail"
            risk_level: "low"
            parameters_schema:
              type: "object"
              required:
                - "to"
                - "subject"
                - "body"
              properties:
                to:
                  type: "array"
                  items:
                    type: "string"
                    format: "email"
                subject:
                  type: "string"
                body:
                  type: "string"
            standing_approvals:
              - standing_approval_id: "sa_def456"
                name: "Company sends"
                constraints:
                  recipient_pattern: "*@mycompany.com"
                  max_recipients: 5
                expires_at: "2026-05-15T00:00:00Z"
          - action_type: "email.read"
            name: "Read Email"
            description: "Read emails from Gmail inbox"
            risk_level: "low"
            parameters_schema:
              type: "object"
              properties:
                sender:
                  type: "string"
                max_results:
                  type: "integer"
                  minimum: 1
                  maximum: 100
            standing_approvals: []
      - id: "stripe"
        name: "Stripe"
        description: "Payment processing via Stripe API"
        credentials_ready: false
        credentials_setup_url: "http://localhost:8080/connect/stripe"
        actions:
          - action_type: "payment.charge"
            name: "Charge Payment"
            description: "Charge a customer's payment method"
            risk_level: "high"
            parameters_schema:
              type: "object"
              required:
                - "amount"
                - "currency"
              properties:
                amount:
                  type: "integer"
                currency:
                  type: "string"
            standing_approvals: []
            
ConnectorInstanceCapability:
  type: object
  required:
    - id
    - credentials_ready
  properties:
    id:
      type: string
      format: uuid
      description: Instance identifier (also accepted as `connector_instance`).
    display:
      type: string
      description: >-
        Credential nickname / workspace name for this instance (from the bound credential). Omitted
        when unset. Use `id` or this value as `action.parameters.connector_instance` when multiple
        instances exist.
    credentials_ready:
      type: boolean
      description: Whether this specific instance has required credentials bound.

ConnectorCapability:
  type: object
  required:
    - id
    - name
    - credentials_ready
    - actions
  properties:
    id:
      type: string
      maxLength: 128
      pattern: '^[a-z][a-z0-9_.-]*$'
      description: |
        Connector identifier (e.g., `gmail`, `stripe`).
      example: "gmail"

    name:
      type: string
      maxLength: 256
      description: |
        Human-readable connector name.
      example: "Gmail"

    description:
      type: string
      maxLength: 500
      description: |
        Brief description of what this connector does.
      example: "Send and manage emails via Gmail API"

    credentials_ready:
      type: boolean
      description: |
        Whether required credentials for this connector are assigned to this
        agent+connector pair (via `agent_connector_credentials`). Unassigned
        global credentials alone do not make this `true`.

        - `true`: A credential or OAuth connection is bound — actions can be executed.
        - `false`: No valid binding — action execution will fail with
          `404 credentials_not_found`. The agent should direct the user to
          `credentials_setup_url` to connect their account.

        **Security**: This field only indicates presence/absence. No credential
        values, types, or metadata are exposed to the agent.
      example: true

    credentials_setup_url:
      type: string
      format: uri
      maxLength: 2048
      description: |
        URL where the user can set up credentials for this connector (e.g., a
        link to the provider's API key page). Only included when
        `credentials_ready` is `false`. The agent can present this URL to the
        user to prompt credential setup.
      example: "http://localhost:8080/connect/stripe"

    instances:
      type: array
      items:
        $ref: '#/ConnectorInstanceCapability'
      description: |
        Enabled connector instances for this agent (one row per workspace/account binding).
        Use `display` (credential nickname) or `id` as `action.parameters.connector_instance` when multiple instances exist.

    actions:
      type: array
      items:
        $ref: '../schemas/capabilities.yaml#/ActionCapability'
      description: |
        Actions available through this connector, with full parameter schemas
        and authorization status.

  example:
    id: "gmail"
    name: "Gmail"
    description: "Send and manage emails via Gmail API"
    credentials_ready: true
    actions:
      - action_type: "email.send"
        name: "Send Email"
        description: "Send an email via Gmail"
        risk_level: "low"
        parameters_schema:
          type: "object"
          required:
            - "to"
            - "subject"
            - "body"
        standing_approvals: []
        
ActionCapability:
  type: object
  required:
    - action_type
    - name
    - standing_approvals
  properties:
    action_type:
      type: string
      maxLength: 128
      description: |
        Action type identifier. Use this value as `action.type` when submitting
        approval requests (`POST /v1/approvals/request`) and as `action_id` when
        executing actions (`POST /v1/actions/execute`).
      example: "email.send"

    name:
      type: string
      maxLength: 256
      description: |
        Human-readable action name.
      example: "Send Email"

    description:
      type: string
      maxLength: 500
      description: |
        Brief description of what this action does.
      example: "Send an email via Gmail"

    risk_level:
      type: string
      enum:
        - low
        - medium
        - high
      description: |
        Default risk level for this action type.

        - **low**: Minimal impact, easily reversible (e.g., read data, send notification)
        - **medium**: Moderate impact (e.g., update records, post content)
        - **high**: Significant impact, hard to reverse (e.g., delete data, make payment)
      example: "low"

    parameters_schema:
      type: object
      additionalProperties: true
      description: |
        JSON Schema describing the expected parameters for this action. Agents
        should validate parameters against this schema before submitting approval
        requests or executing actions.

        When the user has **multiple connector instances** for this connector
        (multiple workspaces/accounts), the server injects an optional
        `connector_instance` property: a `string` with `format: uuid`, `enum` listing
        allowed instance IDs, and a `description` that maps each UUID to its display
        name. Omit it to use the **default** instance when one is configured; otherwise
        pass a UUID or nickname from `GET /agents/{id}/capabilities`.

        The schema follows standard JSON Schema (draft-07) conventions and includes
        `type`, `required`, `properties`, and validation keywords like `maxLength`,
        `minimum`, `format`, etc.
      example:
        type: "object"
        required:
          - "to"
          - "subject"
          - "body"
        properties:
          to:
            type: "array"
            items:
              type: "string"
              format: "email"
          subject:
            type: "string"
            maxLength: 998
          body:
            type: "string"

    meta_constraint_fields:
      type: array
      items:
        type: string
      description: |
        Verified metadata fields supported in standing approval `$meta` constraints
        for this action (e.g. `from`, `to`, `cc`, `bcc`). Values are checked against
        server-fetched envelope data, not agent-supplied parameters. Omitted when the
        action does not support `$meta` constraints.
      example:
        - "from"
        - "sender"
        - "senders"
        - "to"
        - "cc"
        - "bcc"

    standing_approvals:
      type: array
      items:
        $ref: '../schemas/capabilities.yaml#/StandingApprovalCapability'
      description: |
        Active standing approvals for this action type. Each standing approval
        defines constraints under which the agent can execute this action
        immediately without per-request human approval.

        **If non-empty**: The agent can execute this action via
        `POST /v1/actions/execute` (without a token) as long as the request
        parameters fall within a standing approval's constraints. Permission Slip
        will match the best standing approval automatically.

        **If empty**: The agent must use the one-off approval flow —
        `POST /v1/approvals/request` → user approves via dashboard.

        **If parameters don't match any standing approval's constraints**: The
        request falls through to the one-off approval flow automatically (Permission
        Slip returns `404` with a hint to use `POST /v1/approvals/request`).



  example:
    action_type: "email.send"
    name: "Send Email"
    description: "Send an email via Gmail"
    risk_level: "low"
    parameters_schema:
      type: "object"
      required:
        - "to"
        - "subject"
        - "body"
    standing_approvals:
      - standing_approval_id: "sa_def456"
        name: "Company sends"
        constraints:
          recipient_pattern: "*@mycompany.com"
        expires_at: "2026-05-15T00:00:00Z"

StandingApprovalCapability:
  type: object
  required:
    - standing_approval_id
    - constraints
  properties:
    standing_approval_id:
      type: string
      pattern: '^sa_[a-zA-Z0-9]{6,64}$'
      maxLength: 70
    name:
      type: string
      nullable: true
      maxLength: 255
    constraints:
      type: object
      additionalProperties: true
    expires_at:
      type: string
      format: date-time
      nullable: true
    connector_instance_id:
      type: string
      format: uuid
      nullable: true
