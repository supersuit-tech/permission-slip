CreatePushSubscriptionRequest:
  description: |
    Register an Expo push token from the mobile app. Use `type: "expo"` or
    `type: "mobile-push"` — both are accepted.
  $ref: '#/CreateExpoPushSubscriptionRequest'

CreateExpoPushSubscriptionRequest:
  type: object
  description: Register an Expo push token from the mobile app.
  required:
    - expo_token
  properties:
    type:
      type: string
      description: |
        Subscription type. Use "expo" or "mobile-push" — both are accepted
        and create a mobile-push channel subscription. May be omitted.
      enum:
        - expo
        - mobile-push
      example: "expo"
    expo_token:
      type: string
      description: Expo push token from expo-notifications
      example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"

PushSubscriptionResponse:
  type: object
  description: A registered push subscription.
  required:
    - id
    - channel
    - created_at
  properties:
    id:
      type: integer
      format: int64
      description: Subscription ID
      example: 1
    channel:
      type: string
      description: The push channel type
      enum:
        - mobile-push
      example: "mobile-push"
    expo_token:
      type: string
      description: Expo push token
      example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
    created_at:
      type: string
      format: date-time
      description: When the subscription was registered
      example: "2026-02-27T10:00:00Z"

PushSubscriptionListResponse:
  type: object
  description: List of registered push subscriptions.
  required:
    - subscriptions
  properties:
    subscriptions:
      type: array
      items:
        $ref: '#/PushSubscriptionResponse'

DeletePushSubscriptionResponse:
  type: object
  description: Confirmation of push subscription deletion.
  required:
    - id
    - deleted_at
  properties:
    id:
      type: integer
      format: int64
      description: Deleted subscription ID
      example: 1
    deleted_at:
      type: string
      format: date-time
      description: Deletion timestamp
      example: "2026-02-27T10:05:00Z"

UnregisterExpoPushTokenRequest:
  type: object
  description: Request to unregister an Expo push token (e.g. on mobile logout).
  required:
    - expo_token
  properties:
    expo_token:
      type: string
      description: The Expo push token to unregister
      example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"

UnregisterExpoPushTokenResponse:
  type: object
  description: Confirmation that the Expo push token was unregistered.
  required:
    - unregistered_at
  properties:
    unregistered_at:
      type: string
      format: date-time
      description: When the token was unregistered
      example: "2026-02-27T10:05:00Z"
