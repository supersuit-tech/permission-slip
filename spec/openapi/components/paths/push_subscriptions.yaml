pushSubscriptions:
  get:
    summary: List push subscriptions
    description: |
      Returns push subscriptions registered by the authenticated user.
      Optionally filter by channel type using the `channel` query parameter.
    operationId: listPushSubscriptions
    tags:
      - Push Subscriptions
    security:
      - SupabaseSession: []
    parameters:
      - name: channel
        in: query
        required: false
        description: Filter by push channel type. Omit to list all subscriptions.
        schema:
          type: string
          enum:
            - mobile-push
    responses:
      '200':
        description: Push subscriptions retrieved
        content:
          application/json:
            schema:
              $ref: '../schemas/push_subscriptions.yaml#/PushSubscriptionListResponse'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '500':
        $ref: '../responses/errors.yaml#/InternalServerError'

  post:
    summary: Register push subscription
    description: |
      Register an Expo push token for mobile push notifications. Use
      `type: "expo"` or `type: "mobile-push"` (both are accepted). If a
      subscription with the same token already exists, it is refreshed.
    operationId: createPushSubscription
    tags:
      - Push Subscriptions
    security:
      - SupabaseSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/push_subscriptions.yaml#/CreatePushSubscriptionRequest'
    responses:
      '201':
        description: Push subscription created
        content:
          application/json:
            schema:
              $ref: '../schemas/push_subscriptions.yaml#/PushSubscriptionResponse'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '500':
        $ref: '../responses/errors.yaml#/InternalServerError'

pushSubscriptionById:
  delete:
    summary: Delete push subscription
    description: Remove a push subscription by ID.
    operationId: deletePushSubscription
    tags:
      - Push Subscriptions
    security:
      - SupabaseSession: []
    parameters:
      - name: subscription_id
        in: path
        required: true
        description: Push subscription ID
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Push subscription deleted
        content:
          application/json:
            schema:
              $ref: '../schemas/push_subscriptions.yaml#/DeletePushSubscriptionResponse'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '500':
        $ref: '../responses/errors.yaml#/InternalServerError'

pushSubscriptionUnregister:
  post:
    summary: Unregister Expo push token
    description: |
      Remove an Expo push token by value. This is more convenient for mobile
      clients than DELETE by ID, since the device knows its own token but may
      not have cached the subscription ID. Typically called on logout.
    operationId: unregisterExpoPushToken
    tags:
      - Push Subscriptions
    security:
      - SupabaseSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/push_subscriptions.yaml#/UnregisterExpoPushTokenRequest'
    responses:
      '200':
        description: Expo push token unregistered
        content:
          application/json:
            schema:
              $ref: '../schemas/push_subscriptions.yaml#/UnregisterExpoPushTokenResponse'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '500':
        $ref: '../responses/errors.yaml#/InternalServerError'
