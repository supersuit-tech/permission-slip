agentWebhook:
  put:
    operationId: setAgentWebhook
    summary: Register Agent Wake Webhook
    description: |
      Register the OpenClaw gateway hooks URL and token for server-push approval wakes.
      The URL must resolve to a private network address (RFC1918, Tailscale/CGNAT, or loopback).
      Performs a test delivery before saving.
    tags:
      - Agents
    security:
      - PermissionSlipSignature: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/agent_webhook.yaml#/SetAgentWebhookRequest'
    responses:
      '200':
        description: Webhook saved
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '503':
        $ref: '../responses/errors.yaml#/ServiceUnavailable'
  get:
    operationId: getAgentWebhook
    summary: Get Agent Wake Webhook
    description: |
      Returns the configured hooks URL. Pass `?test=true` to fire a test wake.
    tags:
      - Agents
    security:
      - PermissionSlipSignature: []
    parameters:
      - name: test
        in: query
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Webhook status
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
  delete:
    operationId: clearAgentWebhook
    summary: Clear Agent Wake Webhook
    tags:
      - Agents
    security:
      - PermissionSlipSignature: []
    responses:
      '200':
        description: Webhook cleared
        content:
          application/json:
            schema:
              type: object
              properties:
                cleared:
                  type: boolean
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'

agentApprovalSweep:
  get:
    operationId: agentApprovalSweep
    summary: Agent Approval Heartbeat Sweep
    description: |
      Returns the calling agent's pending approvals and those resolved since
      `resolved_since` (default 24 hours ago). Used by OpenClaw heartbeat sweeps.
    tags:
      - Approvals
    security:
      - PermissionSlipSignature: []
    parameters:
      - name: resolved_since
        in: query
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: Sweep results
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentApprovalSweepResponse'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
