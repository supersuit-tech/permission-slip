agentWebhook:
  put:
    operationId: setAgentWebhook
    summary: Register Agent Wake Webhook
    description: |
      Register the wake token and provider for server-push approval wakes.
      The destination URL is not stored. Each approval request supplies `callback_url`,
      which must match this provider (private network for OpenClaw, Cursor automation
      webhook for Grok Bot). To try delivery, call GET with `test=true` and `url`.
    tags:
      - Agents
    security:
      - PermissionSlipSignature: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/agent_webhook.yaml#/SetAgentWebhookRequest'
    responses:
      '200':
        description: Webhook saved
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '503':
        $ref: '../responses/errors.yaml#/ServiceUnavailable'
  get:
    operationId: getAgentWebhook
    summary: Get Agent Wake Webhook
    description: |
      Returns whether a wake token is registered, and its provider.
      Pass `test=true` and `url` to POST a test wake to that URL using the stored token.
    tags:
      - Agents
    security:
      - PermissionSlipSignature: []
    parameters:
      - name: test
        in: query
        schema:
          type: boolean
          default: false
      - name: url
        in: query
        schema:
          type: string
        description: Required when `test=true`. Full callback URL to POST the test wake to.
    responses:
      '200':
        description: Webhook status
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
  delete:
    operationId: clearAgentWebhook
    summary: Clear Agent Wake Webhook
    tags:
      - Agents
    security:
      - PermissionSlipSignature: []
    responses:
      '200':
        description: Webhook cleared
        content:
          application/json:
            schema:
              type: object
              properties:
                cleared:
                  type: boolean
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'

agentApprovalSweep:
  get:
    operationId: agentApprovalSweep
    summary: Agent Approval Heartbeat Sweep
    description: |
      Returns the calling agent's pending approvals and those resolved since
      `resolved_since` (default 24 hours ago). Used by OpenClaw heartbeat sweeps.
    tags:
      - Approvals
    security:
      - PermissionSlipSignature: []
    parameters:
      - name: resolved_since
        in: query
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: Sweep results
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentApprovalSweepResponse'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
