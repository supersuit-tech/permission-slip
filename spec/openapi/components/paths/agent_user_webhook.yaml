agentUserWebhook:
  get:
    operationId: getAgentWebhookForUser
    summary: Get agent wake webhook (user session)
    description: |
      Returns the configured webhook URL and provider for the agent. Pass `?test=true` to fire a test wake.
      The token is never returned — only `configured`, `webhook_url`, `provider`, and optional warning.
    tags:
      - Agents
    security:
      - SupabaseSession: []
    parameters:
      - $ref: '../parameters/common.yaml#/AgentId'
      - name: test
        in: query
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Webhook status
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
  put:
    operationId: setAgentWebhookForUser
    summary: Register agent wake webhook (user session)
    description: |
      Register the wake webhook URL and token for server-push approval wakes.
      `provider` selects the delivery adapter (`openclaw` default, or `grokbot`).
      OpenClaw URLs must resolve to a private network address. Grok Bot URLs must
      be `https://api2.cursor.sh/automations/webhook/…`. Performs a test delivery
      after saving.
    tags:
      - Agents
    security:
      - SupabaseSession: []
    parameters:
      - $ref: '../parameters/common.yaml#/AgentId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/agent_webhook.yaml#/SetAgentWebhookRequest'
    responses:
      '200':
        description: Webhook saved
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '503':
        $ref: '../responses/errors.yaml#/ServiceUnavailable'
  delete:
    operationId: clearAgentWebhookForUser
    summary: Clear agent wake webhook (user session)
    tags:
      - Agents
    security:
      - SupabaseSession: []
    parameters:
      - $ref: '../parameters/common.yaml#/AgentId'
    responses:
      '200':
        description: Webhook cleared
        content:
          application/json:
            schema:
              type: object
              properties:
                cleared:
                  type: boolean
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
