agentUserWebhook:
  get:
    operationId: getAgentWebhookForUser
    summary: Get agent wake webhook (user session)
    description: |
      Returns whether a wake token is registered, and its provider.
      Pass `test=true` and `url` to POST a test wake to that URL.
      The token is never returned.
    tags:
      - Agents
    security:
      - SupabaseSession: []
    parameters:
      - $ref: '../parameters/common.yaml#/AgentId'
      - name: test
        in: query
        schema:
          type: boolean
          default: false
      - name: url
        in: query
        schema:
          type: string
        description: Required when `test=true`. Full callback URL to POST the test wake to.
    responses:
      '200':
        description: Webhook status
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
  put:
    operationId: setAgentWebhookForUser
    summary: Register agent wake webhook (user session)
    description: |
      Register the wake token and provider. The destination URL is supplied per
      approval request as `callback_url`, not stored on the agent.
    tags:
      - Agents
    security:
      - SupabaseSession: []
    parameters:
      - $ref: '../parameters/common.yaml#/AgentId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/agent_webhook.yaml#/SetAgentWebhookRequest'
    responses:
      '200':
        description: Webhook saved
        content:
          application/json:
            schema:
              $ref: '../schemas/agent_webhook.yaml#/AgentWebhookConfig'
      '400':
        $ref: '../responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
      '503':
        $ref: '../responses/errors.yaml#/ServiceUnavailable'
  delete:
    operationId: clearAgentWebhookForUser
    summary: Clear agent wake webhook (user session)
    tags:
      - Agents
    security:
      - SupabaseSession: []
    parameters:
      - $ref: '../parameters/common.yaml#/AgentId'
    responses:
      '200':
        description: Webhook cleared
        content:
          application/json:
            schema:
              type: object
              properties:
                cleared:
                  type: boolean
      '401':
        $ref: '../responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../responses/errors.yaml#/NotFound'
